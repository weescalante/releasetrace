name: PreDB TV Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test PreDB TV access
        run: |
          echo "Testing PreDB TV page from GitHub Actions..."

          curl \
            --silent \
            --show-error \
            --location \
            --output /tmp/predb-tv.html \
            --write-out "HTTP STATUS: %{http_code}\nSIZE: %{size_download} bytes\n" \
            -H "User-Agent: WatchLeaks/1.0" \
            -H "Accept: text/html,application/xhtml+xml" \
            "https://predb.me/?cats=tv"

          echo "Downloaded file size:"
          wc -c /tmp/predb-tv.html
